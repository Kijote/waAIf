services:
  nginx:
    image: nginx:1.27-alpine
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    networks: [lab]
    # Deliberately no published host port.
  vire:
    build: ./scanner
    depends_on: [nginx]
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    volumes:
      - ./fixtures:/fixtures:ro
      - ./reports:/reports
    environment:
      INVENTORY_PATH: /fixtures/nginx-sample.json
      ADVISORIES_PATH: /fixtures/advisories.json
      OUTPUT_PATH: /reports/report.json
    network_mode: none
networks:
  lab: {}
