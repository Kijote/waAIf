services:
  nginx:
    image: nginx:1.27-alpine
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    networks: [lab]
    # No published host port.
  vire:
    build: ./scanner
    depends_on: [nginx]
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    volumes:
      - ./fixtures:/fixtures:ro
      - ./reports:/reports
      - ../..:/project:ro
    environment:
      INVENTORY_PATH: /fixtures/nginx-sample.json
      ADVISORIES_PATH: /fixtures/advisories.json
      OUTPUT_PATH: /reports/report.json
    network_mode: none
  sbom:
    build: ./scanner
    profiles: [sbom]
    entrypoint: ["sh", "-c", "python /app/sbom.py ${SBOM_INPUT:-/fixtures/sample.cdx.json}"]
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    volumes:
      - ./fixtures:/fixtures:ro
      - ./reports:/runtime:ro
    network_mode: none
  reconcile:
    build: ./scanner
    profiles: [reconcile]
    entrypoint: ["sh", "-c", "python /app/inventory.py /project > /tmp/declared.json && python /app/reconcile.py /tmp/declared.json ${RUNTIME_INPUT:-/fixtures/runtime-sample.json}"]
    read_only: true
    tmpfs:
      - /tmp
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    volumes:
      - ../..:/project:ro
      - ./fixtures:/fixtures:ro
      - ./reports:/runtime:ro
    network_mode: none
  inventory:
    build: ./scanner
    entrypoint: ["python", "/app/inventory.py", "/project"]
    profiles: [inventory]
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    volumes:
      - ../..:/project:ro
    network_mode: none
networks:
  lab: {}
