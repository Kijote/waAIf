services:
  app:
    image: python:3.12-alpine
    working_dir: /srv
    volumes:
      - ./app:/srv:ro
    command: ["python", "server.py"]
    expose: ["8080"]
    networks: [lab]
    read_only: true
  nginx:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:8088:80"]
    volumes:
      - ./configs/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - logs:/var/log/nginx
    depends_on: [app]
    networks: [lab]
  # Detector containers are intentionally absent until versions, configurations,
  # and shared event ingestion are defined and verified.
volumes:
  logs:
networks:
  lab: {}
