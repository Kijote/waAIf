log_format waaif_json escape=json
  '{"timestamp":"$time_iso8601","remote_addr":"$remote_addr",'
  '"request_method":"$request_method","uri":"$uri",'
  '"status":$status,"request_time":$request_time,'
  '"bytes_sent":$bytes_sent,"user_agent":"$http_user_agent",'
  '"request_id":"$request_id"}';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.jsonl waaif_json;
    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }
}
